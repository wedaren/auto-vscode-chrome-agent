name: Release VSCode Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pre_release:
        description: '发布为预发布版本'
        type: boolean
        default: false

jobs:
  release-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode-ext

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Compile TypeScript
        run: pnpm compile

      - name: Package extension (.vsix)
        run: pnpm package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: packages/vscode-ext/*.vsix
          retention-days: 30

      - name: Publish to Marketplace (release)
        if: ${{ !inputs.pre_release }}
        run: pnpm publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Marketplace (pre-release)
        if: ${{ inputs.pre_release }}
        run: pnpm vsce publish --pre-release --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode-ext/*.vsix
          generate_release_notes: true
